name = "ultratv-config"
main = "src/index.js"
# Adresse publique : domaine perso (workers.dev est bloqué sur certains réseaux et box) ; workers.dev reste actif
# pour les appareils et liens existants.
workers_dev = true
# ultratv.dpdns.org : site principal ; tv.weedy.dpdns.org : adresse de l'API des applis (ses pages redirigent vers le site).
routes = [{ pattern = "tv.weedy.dpdns.org", custom_domain = true }, { pattern = "ultratv.dpdns.org", custom_domain = true }]
compatibility_date = "2025-09-01"

# Fichiers fixes (manifeste, service worker, icônes, polices, jsQR) servis par Workers Static Assets : gratuits et
# hors quota de requêtes Worker. Générés depuis src/ par scripts/build-assets.mjs (contrôlé avant les tests).
[assets]
directory = "./public"

# Namespace KV : comptes, appareils appairés, crashs et journaux.
#   wrangler kv namespace create CONFIG   (+ --preview pour `wrangler dev`)
# Stockage : Turso (STORAGE_MODE = "turso", src/turso.js). Anciennes liaisons retirées le 15/11/2026 après validation
# de bout en bout ; la base D1 « ultratv-telemetry » (96cdcf98-68e4-4d34-8dda-5a76ae93f459) et l'espace KV CONFIG
# (4d450f36e3e34ddf9520e53bf6c241ea) sont CONSERVÉS chez Cloudflare, intacts, en secours. Retour arrière : remettre ces
# deux blocs (git) et STORAGE_MODE = "d1", puis node scripts/turso-migrate.mjs pour recopier Turso → D1 si besoin.

# Base D1 : télémétrie (journaux, plantages, relevés anonymes) et dernière activité des appareils. Sortis de KV pour
# rester sous son quota gratuit de 1 000 écritures par jour (erreur 10048).
#   wrangler d1 create ultratv-telemetry   (puis coller le database_id ci-dessous)
#   wrangler d1 migrations apply ultratv-telemetry --remote

# Workers AI : traduction automatique des alertes (modèle m2m100, quota gratuit quotidien). Absente en local et en
# test : les alertes gardent alors seulement les traductions saisies.
[ai]
binding = "AI"

# Purge quotidienne des lignes de télémétrie expirées (journaux 7 j, plantages 30 j, relevés anonymes 180 j).
[triggers]
crons = ["17 3 * * *"]

# Durable Object : limites de débit, verrouillages et codes d'appairage.
# Il faut une cohérence forte (KV est éventuellement cohérent : un compteur
# d'échecs y serait contournable en parallèle).
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

# Limiteurs de débit natifs (gratuits, sans Durable Object) pour les routes à fort trafic ; voir nativeLimiter (src/index.js).
[[ratelimits]]
name = "RL_10"
namespace_id = "1010"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_30"
namespace_id = "1030"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_60"
namespace_id = "1060"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_120"
namespace_id = "1120"
simple = { limit = 120, period = 60 }

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]

# SECRETS (jamais dans ce fichier) — `wrangler secret put <NOM>` :
#   SESSION_SECRET      signature des cookies de session (>= 32 caractères)
#   PROVIDER_ENC_KEY    clé AES-256 en base64 (openssl rand -base64 32)
#   OPS_TOKEN           mot de passe des tableaux de bord /crashes et /logs
#   ADMIN_TOKEN         (optionnel) jeton de l'endpoint de migration
#   PROVIDER_ENC_KEY_PREVIOUS  (optionnel) ancienne clé pendant une rotation
#   TMDB_READ_TOKEN     jeton v4 TMDB (proxy /api/tmdb/*, envoyé en Bearer ; prioritaire)
#   TMDB_API_KEY        clé v3 TMDB, repli si le jeton est absent (jamais embarquée dans l'application)
#   OPENSUBTITLES_API_KEY  clé OpenSubtitles (proxy /api/subtitles/*) ; absente -> 503 et l'application désactive l'option
#   OMDB_API_KEY        clé OMDb (notes IMDb / Rotten Tomatoes, /api/ratings) ; absente -> 503 et les notes sont masquées
#   ACCOUNT_RELAY_KEY   clé partagée avec le relais d'abonnement (même valeur que RELAY_KEY sur Vercel, >= 32 caractères)
#   LOG_HOST_SALT       sel des empreintes d'hôte des journaux (>= 32 caractères : openssl rand -hex 32) ; absent -> <host> sans empreinte

# Relais d'abonnement hors Cloudflare (relay/, projet Vercel utv-relay) : fournisseurs qui bloquent les serveurs
# Cloudflare. Sans ACCOUNT_RELAY_KEY, il n'est jamais appelé.
[vars]
# Site principal (voir legacyhost.js) : sans cette variable, tv.weedy.dpdns.org reste le site.
SITE_HOST = "ultratv.dpdns.org"
# Stockage (src/turso.js) : "d1" = D1 + KV ; "tee" = D1 + KV vérité, écritures recopiées dans Turso ; "turso" = Turso seul.
STORAGE_MODE = "turso"
TURSO_URL = "libsql://ultratv-vantaflow.aws-eu-central-1.turso.io"
ACCOUNT_RELAY_URL = "https://utv-relay.vercel.app/api/xtream"
# Comptes ayant accès à /admin (liste séparée par des virgules).
ADMIN_LOGINS = "khalilbenaz"
# Application Trakt « UTV » (PKCE, client public : l'identifiant n'est pas un secret, et il n'y a pas de secret client).
TRAKT_CLIENT_ID = "L6UakaCWI9VuQZevNkAOzKV77d4ob9XRnfLZOPds9Bs"
# Dons : application REST PayPal Business (identifiant client public, pas un secret) ; active les boutons PayPal / carte de /donate.
