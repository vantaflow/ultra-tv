name: Translation
description: Add a language, fix a translation, or report an untranslated text
title: "[Translation] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Only the app interface is translated, never playlist content (channels, categories, titles, guide). See TRANSLATING.md in the repository.
  - type: input
    id: language
    attributes:
      label: Language
      description: Name and code, for example Polish (pl)
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - New language
        - Correction
        - Untranslated text
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where in the app
      multiple: true
      options:
        - TV
        - Mobile
        - Desktop
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen
      description: For example Settings > Playback
  - type: textarea
    id: current
    attributes:
      label: Current text
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag and drop an image here.
