# Mises à jour des dépendances : une PR groupée par écosystème et par semaine, pour ne plus prendre de retard
# (Compose, Media3, Coil… avaient plus d'un an de retard en octobre 2026).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android-native
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Un SEUL groupe pour les mises à jour mineures / correctifs : Compose, Kotlin, KSP et Media3 dépendent les uns
      # des autres ; séparées, elles échouaient chacune à la compilation.
      android-mineures: { patterns: ["*"], update-types: ["minor", "patch"] }
      # Les versions majeures arrivent à part : elles demandent souvent d'adapter le code.
      android-majeures: { patterns: ["*"], update-types: ["major"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      web-mineures: { patterns: ["*"], update-types: ["minor", "patch"] }
      web-majeures: { patterns: ["*"], update-types: ["major"] }
  - package-ecosystem: npm
    directory: /electron
    schedule: { interval: weekly, day: monday }
    groups:
      electron-mineures: { patterns: ["*"], update-types: ["minor", "patch"] }
      electron-majeures: { patterns: ["*"], update-types: ["major"] }
  - package-ecosystem: npm
    directory: /cloudflare-config
    schedule: { interval: weekly, day: monday }
    groups:
      worker-mineures: { patterns: ["*"], update-types: ["minor", "patch"] }
      worker-majeures: { patterns: ["*"], update-types: ["major"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ["*"] } }
