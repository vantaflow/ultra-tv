name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  # Annulation réservée aux pull requests : sur main, un run annulé par le commit suivant s'affichait « CI failing »
  # (badge et commit en rouge) alors que rien n'était cassé.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc -b --noEmit

      - name: Unit tests (vitest run)
        run: npx vitest run

  android:
    name: Android (compile + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a preinstalled Android SDK (ANDROID_HOME set);
      # gradle pulls any missing platform/build-tools itself. The
      # android-actions/setup-android action is avoided — its emulator
      # package download is flaky and the emulator isn't needed to compile.

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compile + unit tests
        run: |
          chmod +x gradlew
          ./gradlew compileDebugKotlin testDebugUnitTest --console=plain --stacktrace

      # En cas d'échec, rapports complets en artefact : un échec qui dépend de l'ordre des tests (ex.
      # UncaughtExceptionsBeforeTest) n'est diagnosticable qu'avec la pile « Suppressed » qu'ils contiennent.
      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            android-native/app/build/reports/tests
            android-native/app/build/test-results
          retention-days: 14

  # Le Worker est testé par .github/workflows/worker.yml (vitest + wrangler dry-run).
