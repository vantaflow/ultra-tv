# Fusion automatique des mises à jour MINEURES / correctifs de Dependabot, une fois toutes les vérifications passées.
# Les versions majeures restent à valider à la main.
name: Dependabot auto-merge
on: pull_request_target
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # Aucune vérification n'est « obligatoire » sur main : on attend nous-mêmes la fin de toutes les vérifications
        # de la PR et on ne fusionne que si elles ont TOUTES réussi (un échec laisse la PR ouverte).
        run: |
          # Ce job est lui-même une vérification de la PR : on l'exclut, sinon il s'attendrait indéfiniment.
          sleep 60
          while :; do
            states=$(gh pr checks "$PR_URL" --json name,bucket --jq '[.[] | select(.name != "automerge") | .bucket] | unique | join(",")')
            case "$states" in
              *fail*|*cancel*) echo "Vérifications en échec ($states) : pas de fusion."; exit 0 ;;
              *pending*|"") sleep 30 ;;
              *) break ;;
            esac
          done
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
