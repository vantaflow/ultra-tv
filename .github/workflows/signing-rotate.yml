# Rotation de la clé de signature (ponctuelle) : prolonge la chaîne de rotation de l'ancienne clé des releases
# (secrets ULTRA_*) vers la nouvelle (secrets ULTRA2_*, créée sur le Mac de développement). Les appareils qui ont une
# version signée par l'ancienne clé acceptent ainsi les mises à jour signées par la nouvelle.
# Seule la chaîne (certificats publics + signatures, aucune clé privée) sort, en artefact, pour devenir le secret
# ULTRA2_LINEAGE_BASE64. Les mots de passe passent par variables d'environnement (« env: »), jamais en clair.
name: Signing rotate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prolonger la chaîne de rotation vers la nouvelle clé
        env:
          OLD_KS: ${{ secrets.ULTRA_KEYSTORE_BASE64 }}
          OLD_LINEAGE: ${{ secrets.ULTRA_LINEAGE_BASE64 }}
          OLD_KS_PASS: ${{ secrets.ULTRA_KEYSTORE_PASSWORD }}
          OLD_ALIAS: ${{ secrets.ULTRA_KEY_ALIAS }}
          OLD_KEY_PASS: ${{ secrets.ULTRA_KEY_PASSWORD }}
          NEW_KS: ${{ secrets.ULTRA2_KEYSTORE_BASE64 }}
          NEW_KS_PASS: ${{ secrets.ULTRA2_KEYSTORE_PASSWORD }}
          NEW_ALIAS: ${{ secrets.ULTRA2_KEY_ALIAS }}
          NEW_KEY_PASS: ${{ secrets.ULTRA2_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          w="$RUNNER_TEMP/rot"; mkdir -p "$w" "$RUNNER_TEMP/out"
          printf '%s' "$OLD_KS" | base64 -d > "$w/old.ks"
          printf '%s' "$OLD_LINEAGE" | base64 -d > "$w/old.lineage"
          printf '%s' "$NEW_KS" | base64 -d > "$w/new.ks"
          : "${OLD_KEY_PASS:=$OLD_KS_PASS}"; export OLD_KEY_PASS
          : "${NEW_KEY_PASS:=$NEW_KS_PASS}"; export NEW_KEY_PASS
          SIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          "$SIGNER" rotate --in "$w/old.lineage" --out "$RUNNER_TEMP/out/ultra.lineage" \
            --old-signer --ks "$w/old.ks" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_KS_PASS --key-pass env:OLD_KEY_PASS \
            --new-signer --ks "$w/new.ks" --ks-key-alias "$NEW_ALIAS" --ks-pass env:NEW_KS_PASS --key-pass env:NEW_KEY_PASS
          "$SIGNER" lineage --in "$RUNNER_TEMP/out/ultra.lineage" --print-certs | grep -E "Signer|SHA-256"
          rm -rf "$w"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-lineage
          path: ${{ runner.temp }}/out/ultra.lineage
          retention-days: 1
