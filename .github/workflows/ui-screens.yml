# Captures d'écran de l'app Android TV sur émulateur (Android TV 11, 1080p), avec un faux serveur Xtream
# (tools/screens/mock_xtream.py, catalogue fictif). Les images sont jointes au run en artefact « ui-screens »
# (une seule branche dans le dépôt : main). À la main (Actions › UI screenshots).
name: UI screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-screens
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start mock Xtream server
        run: |
          nohup python3 tools/screens/mock_xtream.py 8080 > mock.log 2>&1 &
          sleep 2
          curl -fsS "http://127.0.0.1:8080/player_api.php?username=demo&password=demo" | head -c 200

      - name: Emulator + captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: OUT=screens bash tools/screens/capture.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screens
          path: |
            screens/
            mock.log
          if-no-files-found: ignore
          retention-days: 30
