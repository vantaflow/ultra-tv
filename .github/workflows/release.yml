name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build APK + publish GitHub release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      # Fail fast if the pushed tag and the single-source VERSION file disagree.
      # Tag "v1.0.29" must equal "v$(cat VERSION)".
      - name: Verify tag matches VERSION
        working-directory: ${{ github.workspace }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(cat VERSION)"
          echo "tag=$TAG expected=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match VERSION file ('$EXPECTED'). Bump VERSION and retag."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a preinstalled Android SDK; the flaky
      # android-actions/setup-android action (emulator download) is avoided.

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Optional release-signing material. When the ULTRA_* secrets are absent
      # the build falls back to the debug keystore (see build.gradle.kts), still
      # producing an installable debug-signed APK. When present, we materialise
      # the base64 keystore + lineage to disk and the resignRelease task re-signs
      # the APK with the rotation lineage via apksigner.
      - name: Materialise signing keystore (if configured)
        id: signing
        env:
          ULTRA_KEYSTORE_BASE64: ${{ secrets.ULTRA_KEYSTORE_BASE64 }}
          ULTRA_LINEAGE_BASE64: ${{ secrets.ULTRA_LINEAGE_BASE64 }}
        run: |
          if [ -n "$ULTRA_KEYSTORE_BASE64" ]; then
            echo "$ULTRA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ultra.keystore"
            echo "keystore=$RUNNER_TEMP/ultra.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$ULTRA_LINEAGE_BASE64" ]; then
              echo "$ULTRA_LINEAGE_BASE64" | base64 -d > "$RUNNER_TEMP/ultra.lineage"
              echo "lineage=$RUNNER_TEMP/ultra.lineage" >> "$GITHUB_OUTPUT"
            fi
            echo "Release signing material configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ULTRA_* secrets — falling back to plain debug-signed APK."
          fi

      - name: Build release APK
        env:
          ULTRA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ULTRA_KEYSTORE_PASSWORD: ${{ secrets.ULTRA_KEYSTORE_PASSWORD }}
          ULTRA_KEY_ALIAS: ${{ secrets.ULTRA_KEY_ALIAS }}
          ULTRA_KEY_PASSWORD: ${{ secrets.ULTRA_KEY_PASSWORD }}
          ULTRA_LINEAGE: ${{ steps.signing.outputs.lineage }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease resignRelease --console=plain --stacktrace
          else
            ./gradlew assembleRelease --console=plain --stacktrace
          fi

      # Garde-fou : avec les secrets présents, AUCUN APK ne doit partir signé
      # par la clé de debug du runner (différente à chaque build). Sinon la mise
      # à jour échoue chez l'utilisateur : « conflit avec un package existant ».
      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*-release.apk; do
            CERTS=$("$SIGNER" verify --print-certs "$f")
            echo "$f"; echo "$CERTS" | grep -E "DN|SHA-256"
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "::error::$f est signé avec la clé de debug"; exit 1
            fi
          done

      # AGP emits app-release.apk; the release artifact / in-app updater both
      # expect UltraTV-debug.apk (debug-suffixed applicationId lineage). Rename
      # and emit the sibling .sha256 the updater verifies (UltraTV-debug.apk.sha256).
      - name: Stage release assets
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          OUT="android-native/app/build/outputs/apk/release"
          ls -1 "$OUT"
          V="${GITHUB_REF_NAME#v}"
          # APK universel : nom historique attendu par la mise à jour intégrée.
          UNI=$(ls "$OUT"/*universal*-release.apk 2>/dev/null | head -1)
          [ -z "$UNI" ] && [ -f "$OUT/app-release.apk" ] && UNI="$OUT/app-release.apk"
          if [ -z "$UNI" ]; then echo "::error::APK universel introuvable dans $OUT"; exit 1; fi
          cp "$UNI" dist/UltraTV-debug.apk
          # APK par processeur, plus légers (armeabi-v7a = Chromecast HD).
          for abi in armeabi-v7a arm64-v8a x86_64; do
            f=$(ls "$OUT"/*-"$abi"-release.apk 2>/dev/null | head -1)
            # + nom STABLE (sans version) : releases/latest/download/UltraTV-<abi>.apk
            # reste valide d'une version à l'autre (lien Downloader, liens courts).
            [ -n "$f" ] && cp "$f" "dist/UltraTV-$V-$abi.apk" && cp "$f" "dist/UltraTV-$abi.apk"
          done
          cd dist
          sha256sum UltraTV-debug.apk | awk '{print $1}' > UltraTV-debug.apk.sha256
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/UltraTV-debug.apk.sha256
            dist/SHA256SUMS.txt
