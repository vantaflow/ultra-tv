name: Release

on:
  push:
    tags:
      - "v*"
  # Lancée sur un tag par la fusion automatique Dependabot (un tag poussé par un workflow ne déclenche pas « push »).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build APK + publish GitHub release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v7

      # Fail fast if the pushed tag and the single-source VERSION file disagree.
      # Tag "v1.0.29" must equal "v$(cat VERSION)".
      - name: Verify tag matches VERSION
        working-directory: ${{ github.workspace }}
        run: |
          # Pré-version de test : « v1.2.91-rc1 » est accepté pour VERSION 1.2.91 (jamais « latest », voir plus bas).
          TAG="${GITHUB_REF_NAME%%-rc*}"
          EXPECTED="v$(cat VERSION)"
          echo "tag=$TAG expected=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag '$TAG' does not match VERSION file ('$EXPECTED'). Bump VERSION and retag."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a preinstalled Android SDK; the flaky
      # android-actions/setup-android action (emulator download) is avoided.

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      # Optional release-signing material. When the ULTRA_* secrets are absent
      # the build falls back to the debug keystore (see build.gradle.kts), still
      # producing an installable debug-signed APK. When present, we materialise
      # the base64 keystore + lineage to disk and the resignRelease task re-signs
      # the APK with the rotation lineage via apksigner.
      # Clé de signature : la clé « ULTRA2_* » (créée le 11/11/2026, rangée sur le Mac de développement) dès que sa
      # chaîne de rotation existe (workflow « Signing rotate ») ; sinon l'ancienne clé « ULTRA_* », gardée en secours.
      - name: Materialise signing keystore (if configured)
        id: signing
        env:
          ULTRA_KEYSTORE_BASE64: ${{ secrets.ULTRA2_LINEAGE_BASE64 != '' && secrets.ULTRA2_KEYSTORE_BASE64 || secrets.ULTRA_KEYSTORE_BASE64 }}
          ULTRA_LINEAGE_BASE64: ${{ secrets.ULTRA2_LINEAGE_BASE64 != '' && secrets.ULTRA2_LINEAGE_BASE64 || secrets.ULTRA_LINEAGE_BASE64 }}
        run: |
          if [ -n "$ULTRA_KEYSTORE_BASE64" ]; then
            echo "$ULTRA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ultra.keystore"
            echo "keystore=$RUNNER_TEMP/ultra.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$ULTRA_LINEAGE_BASE64" ]; then
              echo "$ULTRA_LINEAGE_BASE64" | base64 -d > "$RUNNER_TEMP/ultra.lineage"
              echo "lineage=$RUNNER_TEMP/ultra.lineage" >> "$GITHUB_OUTPUT"
            fi
            echo "Release signing material configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ULTRA_* secrets — falling back to plain debug-signed APK."
          fi

      - name: Build release APK
        env:
          ULTRA_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          ULTRA_KEYSTORE_PASSWORD: ${{ secrets.ULTRA2_LINEAGE_BASE64 != '' && secrets.ULTRA2_KEYSTORE_PASSWORD || secrets.ULTRA_KEYSTORE_PASSWORD }}
          ULTRA_KEY_ALIAS: ${{ secrets.ULTRA2_LINEAGE_BASE64 != '' && secrets.ULTRA2_KEY_ALIAS || secrets.ULTRA_KEY_ALIAS }}
          ULTRA_KEY_PASSWORD: ${{ secrets.ULTRA2_LINEAGE_BASE64 != '' && secrets.ULTRA2_KEY_PASSWORD || secrets.ULTRA_KEY_PASSWORD }}
          ULTRA_LINEAGE: ${{ steps.signing.outputs.lineage }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease resignRelease --console=plain --stacktrace
          else
            ./gradlew assembleRelease --console=plain --stacktrace
          fi

      # Fichier de correspondance R8 : décode les traces des plantages (noms de classes réduits). Gardé 90 jours.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: android-native/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      # Garde-fou : avec les secrets présents, AUCUN APK ne doit partir signé
      # par la clé de debug du runner (différente à chaque build). Sinon la mise
      # à jour échoue chez l'utilisateur : « conflit avec un package existant ».
      - name: Verify release signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*-release.apk; do
            CERTS=$("$SIGNER" verify --print-certs "$f")
            echo "$f"; echo "$CERTS" | grep -E "DN|SHA-256"
            if echo "$CERTS" | grep -q "CN=Android Debug"; then
              echo "::error::$f est signé avec la clé de debug"; exit 1
            fi
          done

      # AGP emits app-release.apk; the release artifact / in-app updater both
      # expect UltraTV-debug.apk (debug-suffixed applicationId lineage). Rename
      # and emit the sibling .sha256 the updater verifies (UltraTV-debug.apk.sha256).
      - name: Stage release assets
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          OUT="android-native/app/build/outputs/apk/release"
          ls -1 "$OUT"
          V="${GITHUB_REF_NAME#v}"
          # APK universel : nom historique attendu par la mise à jour intégrée.
          UNI=$(ls "$OUT"/*universal*-release.apk 2>/dev/null | head -1)
          [ -z "$UNI" ] && [ -f "$OUT/app-release.apk" ] && UNI="$OUT/app-release.apk"
          if [ -z "$UNI" ]; then echo "::error::APK universel introuvable dans $OUT"; exit 1; fi
          cp "$UNI" dist/UltraTV-debug.apk
          # Copie au nom public (liens de téléchargement : releases/latest/download/UltraTV.apk).
          cp "$UNI" dist/UltraTV.apk
          # APK par processeur, plus légers (armeabi-v7a = Chromecast HD).
          for abi in armeabi-v7a arm64-v8a x86_64; do
            f=$(ls "$OUT"/*-"$abi"-release.apk 2>/dev/null | head -1)
            # + nom STABLE (sans version) : releases/latest/download/UltraTV-<abi>.apk
            # reste valide d'une version à l'autre (lien Downloader, liens courts).
            [ -n "$f" ] && cp "$f" "dist/UltraTV-$V-$abi.apk" && cp "$f" "dist/UltraTV-$abi.apk"
          done
          # Profil de démarrage précompilé (.dm, format Android 12+) pour chaque APK versionné : installé avec l'APK
          # (adb install-multiple UltraTV-X-abi.apk UltraTV-X-abi.dm), ART compile en speed-profile dès l'installation
          # au lieu d'attendre une optimisation de fond. Mesuré sur une box 2 Go : démarrage 1,1 s → 0,6 s, p99 550 → 150 ms.
          PROFGEN=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/profgen 2>/dev/null | sort -V | tail -1)
          if [ -n "$PROFGEN" ]; then
            for f in dist/UltraTV-"$V"-*.apk; do
              "$PROFGEN" extractProfile -a "$f" -odm "${f%.apk}.dm" -pf v0_1_5_s || echo "::warning::.dm non généré pour $f"
            done
          else
            echo "::warning::profgen introuvable : pas de .dm"
          fi
          cd dist
          sha256sum UltraTV-debug.apk | awk '{print $1}' > UltraTV-debug.apk.sha256
          sha256sum UltraTV.apk | awk '{print $1}' > UltraTV.apk.sha256
          # Condensat des copies à nom fixe par processeur (même format que UltraTV.apk.sha256).
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "UltraTV-$abi.apk" ] && sha256sum "UltraTV-$abi.apk" | awk '{print $1}' > "UltraTV-$abi.apk.sha256"
          done
          sha256sum *.apk $(ls *.dm 2>/dev/null) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Notes de la release = section de la version dans le CHANGELOG : l'appli en tire le résumé des nouveautés
      # affiché dans l'invite de mise à jour (UpdateNotes).
      - name: Release notes from CHANGELOG
        working-directory: ${{ github.workspace }}
        run: |
          V="$(cat VERSION)"
          awk -v v="$V" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "---- notes ($(wc -l < "$RUNNER_TEMP/notes.md") lignes)"; head -20 "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          # Tag « -rcN » : pré-version de test, jamais « latest » (ni l'appli ni /download/android ne la proposent).
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          make_latest: ${{ contains(github.ref_name, '-rc') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.dm
            dist/UltraTV-debug.apk.sha256
            dist/UltraTV.apk.sha256
            dist/UltraTV-arm64-v8a.apk.sha256
            dist/UltraTV-armeabi-v7a.apk.sha256
            dist/UltraTV-x86_64.apk.sha256
            dist/SHA256SUMS.txt
