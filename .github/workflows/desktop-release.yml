name: Desktop release

# Application bureau (Electron) : macOS (.dmg + .zip universels), Windows (NSIS x64),
# Linux (AppImage + .deb + .rpm x64). Declenchee par un tag `desktop-vX.Y.Z` (= version de
# electron/package.json) ou a la main (workflow_dispatch : artefacts seulement).
# La publication sur GitHub Releases (brouillon) n'a lieu que sur tag.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

# Permissions minimales par defaut ; seul le job `release` obtient contents: write.
permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ffmpeg minimal LGPL (lecture http(s)/HLS/MKV/MP4/TS, audio → AAC, sortie MPEG-TS) pour la conversion audio du
  # bureau : Windows en compilation croisée mingw-w64 (TLS Schannel), Linux natif (TLS OpenSSL 3). macOS : ffmpeg du système.
  ffmpeg:
    name: Build minimal ffmpeg (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # lecture des artefacts du dernier build réussi
    strategy:
      matrix:
        target: [win, linux]
    steps:
      - uses: actions/checkout@v7
      # Script de compilation inchangé depuis le dernier build réussi : son ffmpeg est réutilisé tel quel (pas d'apt,
      # pas de compilation). Sinon, ou si l'artefact a expiré, compilation complète ci-dessous.
      - name: Reuse ffmpeg from last successful build
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -u
          script=electron/scripts/build-ffmpeg-min.sh
          here=$(git hash-object "$script")
          for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow desktop-release.yml --status success --limit 5 --json databaseId -q '.[].databaseId'); do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" -q .head_sha) || continue
            then_=$(gh api "repos/$GITHUB_REPOSITORY/contents/$script?ref=$sha" -q .sha 2>/dev/null) || continue
            [ "$then_" = "$here" ] || { echo "run $run : script différent"; continue; }
            rm -rf electron/vendor/ffmpeg && mkdir -p electron/vendor/ffmpeg
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "ffmpeg-$TARGET" -D electron/vendor/ffmpeg 2>/dev/null && [ -n "$(ls -A electron/vendor/ffmpeg)" ]; then
              echo "ffmpeg-$TARGET réutilisé depuis le run $run ($sha)"; ls -la electron/vendor/ffmpeg
              echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "run $run : artefact indisponible"
          done
          echo "Aucun ffmpeg réutilisable : compilation complète"
      # Le miroir Azure d'Ubuntu ne répond pas toujours (DNS) : 3 essais, puis bascule sur archive.ubuntu.com.
      - name: Toolchain
        if: steps.reuse.outputs.ok != 'true'
        timeout-minutes: 15
        run: |
          pkgs="nasm libssl-dev gcc-mingw-w64-x86-64"
          for i in 1 2 3; do
            if [ "$i" = 3 ]; then
              echo "Miroir Azure injoignable : bascule sur archive.ubuntu.com"
              sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt 2>/dev/null || true
              sudo sed -i 's#^URIs: mirror+file:/etc/apt/apt-mirrors.txt#URIs: http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            timeout 240 sudo apt-get update -q -o Acquire::Retries=3 && timeout 400 sudo apt-get install -y -q -o Acquire::Retries=3 $pkgs && exit 0
            echo "Essai $i échoué"; sleep 20
          done
          exit 1
      - name: Build
        if: steps.reuse.outputs.ok != 'true'
        working-directory: electron
        run: bash scripts/build-ffmpeg-min.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: electron/vendor/ffmpeg/

  build:
    name: Build ${{ matrix.name }}
    needs: ffmpeg
    # `matrix` n'existe pas dans un `if:` de job : pas de condition ici.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            artifact: desktop-mac
            builder_args: "--mac dmg zip --universal"
          - name: Windows (x64)
            os: windows-latest
            artifact: desktop-win
            builder_args: "--win nsis --x64"
          - name: Linux (x64)
            os: ubuntu-latest
            artifact: desktop-linux
            builder_args: "--linux AppImage deb rpm --x64"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      # Sur tag, `desktop-vX.Y.Z` doit correspondre a electron/package.json :
      # electron-builder nomme les artefacts et latest*.yml d'apres ce fichier.
      - name: Verify tag matches electron version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="desktop-v$(node -p "require('./electron/package.json').version")"
          echo "tag=$TAG expected=$EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Le tag '$TAG' ne correspond pas a electron/package.json ('$EXPECTED')."
            exit 1
          fi

      - name: Web - install
        working-directory: web
        run: npm ci

      - name: Web - tests
        working-directory: web
        run: npm test

      - name: Web - build
        working-directory: web
        run: npm run build

      - name: Electron - install
        working-directory: electron
        run: npm ci

      - name: Electron - tests
        working-directory: electron
        run: npm test

      - name: Embed web build
        working-directory: electron
        run: npm run prepare:web

      # Signature uniquement si les secrets existent ; sinon build non signe
      # (macOS : signature ad hoc via scripts/adhoc-sign.cjs). Les valeurs vides
      # ne sont jamais exportees : electron-builder les traiterait mal.
      - name: Configure code signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          export_if_set() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "${name}=${value}" >> "$GITHUB_ENV"
            fi
          }
          case "$RUNNER_OS" in
            macOS)
              if [ -n "$MAC_CSC_LINK" ]; then
                export_if_set CSC_LINK "$MAC_CSC_LINK"
                export_if_set CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
                export_if_set APPLE_ID "$APPLE_ID"
                export_if_set APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
                export_if_set APPLE_TEAM_ID "$APPLE_TEAM_ID"
                echo "Signature macOS : activee."
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "Aucun secret macOS : build non signe (ad hoc)."
              fi
              ;;
            Windows)
              if [ -n "$WIN_CSC_LINK" ]; then
                export_if_set CSC_LINK "$WIN_CSC_LINK"
                export_if_set CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
                echo "Signature Windows : activee."
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "Aucun secret Windows : build non signe."
              fi
              ;;
            *)
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              ;;
          esac

      # Conversion audio AC-3 / DTS (transcode.cjs) : ffmpeg minimal LGPL (~3 Mo) construit par le job « ffmpeg ».
      - name: Get minimal LGPL ffmpeg
        if: runner.os != 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-${{ runner.os == 'Windows' && 'win' || 'linux' }}
          path: electron/vendor/ffmpeg

      - name: Make ffmpeg executable
        if: runner.os == 'Linux'
        run: chmod +x electron/vendor/ffmpeg/ffmpeg

      # Le .rpm est construit sur ce runner Ubuntu : electron-builder (fpm) a besoin de rpmbuild.
      - name: Linux - outils de paquets (rpm)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q -o Acquire::Retries=3 && sudo apt-get install -y -q -o Acquire::Retries=3 rpm && exit 0
            echo "Essai $i échoué"; sleep 15
          done
          exit 1

      - name: Package
        working-directory: electron
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.rpm
            electron/release/*.blockmap
            electron/release/latest*.yml

  release:
    name: Publish release
    needs: build
    # Uniquement sur tag (pas de matrix ici).
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -la dist

      # `gh` plutot qu'une action tierce. Publiee directement (plus de brouillon) mais jamais « Latest » : la
      # derniere release reste celle d'Android (mise a jour integree et lien releases/latest/download/UltraTV.apk).
      - name: Create or update release
        run: |
          shopt -s nullglob
          files=(dist/*)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --latest=false \
              --title "Ultra TV desktop ${GITHUB_REF_NAME#desktop-v}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
